<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Shipped - {{ order.order_number }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f4f4f4; }
        .container { background-color: white; border-radius: 8px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { text-align: center; padding-bottom: 30px; }
        .header h1 { color: #2196F3; margin: 0; font-size: 28px; }
        .icon { font-size: 64px; margin: 20px 0; }
        .button { display: inline-block; padding: 12px 30px; background-color: #2196F3; color: white; text-decoration: none; border-radius: 6px; margin: 20px 0; }
        .footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">📦</div>
            <h1>Your Order Has Shipped!</h1>
            <p>Order #{{ order.order_number }}</p>
        </div>

        <p>Dear {{ customer_name }},</p>

        <p>Great news! Your order has been shipped and is on its way to you.</p>

        <p><strong>Estimated Delivery:</strong> 3-5 business days</p>

        <div style="text-align: center;">
            <a href="http://localhost:3000/orders/{{ order.id }}" class="button">Track Your Order</a>
        </div>

        <div class="footer">
            <p>Thank you for shopping with Luxe Market!</p>
            <p>&copy; 2026 Luxe Market. All rights reserved.</p>
        </div>
    </div>
</body>
</html>

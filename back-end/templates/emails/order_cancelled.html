<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Cancelled - {{ order.order_number }}</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f4f4f4; }
        .container { background-color: white; border-radius: 8px; padding: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header { text-align: center; padding-bottom: 30px; }
        .header h1 { color: #f44336; margin: 0; font-size: 28px; }
        .footer { text-align: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid #ddd; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Order Cancelled</h1>
            <p>Order #{{ order.order_number }}</p>
        </div>

        <p>Dear {{ customer_name }},</p>

        <p>Your order has been cancelled as requested.</p>

        <p>If you have any questions about this cancellation, please contact our support team.</p>

        <div class="footer">
            <p>Contact us at <a href="mailto:support@luxemarket.com">support@luxemarket.com</a></p>
            <p>&copy; 2026 Luxe Market. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
